# INCIDENT P1 — compose corrigé (ne pas modifier le code applicatif).
name: incident
services:
  front:
    image: nginx:1.27-alpine
    ports:
      - "8081:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - public
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

  api:
    build: ../../tp04-compose-entreprise/apps/shopapi
    command: ["node", "src/server.js"]
    environment:
      PORT: "3000"
      DATABASE_URL: postgres://shop:shop@db:5432/shop
      REDIS_URL: redis://:r3dis@redis:6379
    networks:
      - public
      - backend
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 15s

  db:
    image: postgres:16.4-alpine
    environment:
      POSTGRES_USER: shop
      POSTGRES_PASSWORD: shop
      POSTGRES_DB: shop
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ../../tp04-compose-entreprise/db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shop -d shop"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--requirepass", "r3dis"]
    networks:
      - backend
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "r3dis", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

networks:
  public:
  backend:

volumes:
  pgdata:
