global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

alerting:
  alertmanagers: []

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: cadvisor
    static_configs:
      - targets: ["cadvisor:8080"]

  # Découverte DNS Compose : tous les A de « api » (réplicas).
  # Pas de docker_sd_configs : le process Prometheus tourne en nobody (uid 65534)
  # et ne peut pas utiliser la socket Docker même montée (docker exec prometheus id).
  - job_name: shop-api
    metrics_path: /metrics
    dns_sd_configs:
      - names: ["api"]
        type: A
        port: 3000
        refresh_interval: 15s

  - job_name: shop-worker
    metrics_path: /metrics
    dns_sd_configs:
      - names: ["worker"]
        type: A
        port: 9100
        refresh_interval: 15s
