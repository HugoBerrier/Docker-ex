services:
  mysql:
    image: mysql:8.0
    container_name: exercice08-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: dogsdb
      MYSQL_USER: dogs
      MYSQL_PASSWORD: dogspass
    ports:
      - "3308:3306"
    volumes:
      - exercice08-mysql-data:/var/lib/mysql
    networks:
      - exercice08-net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-prootpass"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build: ./api
    image: exercice08-dogs-api
    container_name: exercice08-api
    restart: unless-stopped
    ports:
      - "8083:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://exercice08-mysql:3306/dogsdb
      SPRING_DATASOURCE_USERNAME: dogs
      SPRING_DATASOURCE_PASSWORD: dogspass
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - exercice08-net

volumes:
  exercice08-mysql-data:

networks:
  exercice08-net:
    name: exercice08-net
