server.port=8080

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3308/dogsdb}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:dogs}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:dogspass}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
