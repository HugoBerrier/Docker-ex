services:
  mysql:
    image: mysql:8.0
    container_name: exercice09-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: dogsdb
      MYSQL_USER: dogs
      MYSQL_PASSWORD: dogspass
    ports:
      - "3309:3306"
    volumes:
      - exercice09-mysql-data:/var/lib/mysql
    networks:
      - exercice09-net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-prootpass"]
      interval: 5s
      timeout: 5s
      retries: 20

  logs-api:
    build: ./logs-api
    image: exercice09-logs-api
    container_name: exercice09-logs-api
    restart: unless-stopped
    ports:
      - "8085:8080"
    volumes:
      - exercice09-logs-data:/data
    networks:
      - exercice09-net

  crud-api:
    build: ./crud-api
    image: exercice09-crud-api
    container_name: exercice09-crud-api
    restart: unless-stopped
    ports:
      - "8084:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://exercice09-mysql:3306/dogsdb
      SPRING_DATASOURCE_USERNAME: dogs
      SPRING_DATASOURCE_PASSWORD: dogspass
      LOGS_API_URL: http://exercice09-logs-api:8080
    depends_on:
      mysql:
        condition: service_healthy
      logs-api:
        condition: service_started
    networks:
      - exercice09-net

volumes:
  exercice09-mysql-data:
  exercice09-logs-data:

networks:
  exercice09-net:
    name: exercice09-net
