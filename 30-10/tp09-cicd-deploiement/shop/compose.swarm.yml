# Bonus B1 — Docker Swarm : rolling natif (start-first) + rollback automatique.
# docker swarm init
# docker stack deploy -c compose.yml -c compose.swarm.yml shop
services:
  api:
    deploy:
      replicas: 2
      update_config:
        order: start-first
        parallelism: 1
        delay: 5s
        failure_action: rollback
        monitor: 30s
      rollback_config:
        order: start-first
        parallelism: 1
      restart_policy:
        condition: on-failure
