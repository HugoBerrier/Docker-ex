# docker compose -f compose.yml -f compose.prod.yml up -d --wait
# Ne charge pas compose.override.yml : pas de ports de debug, pas de dashboard.
services:
  api:
    build: !reset null
    image: ${REGISTRY:?REGISTRY doit être défini}/shopapi:${VERSION:?VERSION doit être défini}
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    deploy:
      replicas: 2
      resources:
        limits:
          cpus: "0.50"
          memory: 256M

  worker:
    build: !reset null
    image: ${REGISTRY:?REGISTRY doit être défini}/shop-worker:${VERSION:?VERSION doit être défini}
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 256M

  db:
    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: 512M

  redis:
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 128M

  traefik:
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 128M
